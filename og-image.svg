  <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="none" stroke="#04F5FF" stroke-opacity="0.2" stroke-width="1"/>

  <text x="130" y="260" font-size="110" font-family="Arial,sans-serif">⚽</text>

  <text x="280" y="220" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="88" fill="white" letter-spacing="-2">FANTASY</text>
